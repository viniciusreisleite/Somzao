<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - Somzão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0c10;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 3vh 3vw;
      gap: 3vw;
    }

    .media-column {
      flex: 0 0 35%;
      height: 100%;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background-color: #050505;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, #image-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #050505;
    }

    .info-column {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #12141a, #1a1e26);
      border-radius: 20px;
      padding: 3.5vh 2.5vw;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #232733;
      position: relative;
    }

    .header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e11d48;
      padding-bottom: 2vh;
      margin-bottom: 2vh;
      flex-shrink: 0;
    }

        .brand-logo {
      height: 12vh;
      max-width: 22vw;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    .brand-title {
      font-size: 2.7vw !important;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .brand-title span {
      color: #e11d48;
    }

    .badge {
      background: #e11d48;
      color: #fff;
      font-size: 0.85vw;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-bottom: 6px;
      transition: background 0.3s ease;
    }

    

    .caption-text {
      width: 100%;
      color: #e5e5e5;
      font-weight: 500;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .footer-handles {
      display: flex;
      gap: 1.5vw;
      margin-top: 1.5vh;
      font-size: 0.9vw;
      font-weight: 700;
      color: #8f9cae;
      flex-shrink: 0;
    }
      
    video, #image-player {
      background: #000 !important;
      background-color: #000 !important;
    }
      .header-text h1, .header h1 {
      text-transform: uppercase !important;
}
      /* Motor TV Standard 2026 */
    .header-text h1, .header h1 {
      text-transform: uppercase !important;
    }
    .header-text h1 span, .header h1 span {
      text-transform: uppercase !important;
    }
    .info-section {
      height: 100vh !important;
      max-height: 100vh !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
    }
    .caption-container {
      flex: 1 1 auto !important;
      height: 0 !important;
      margin-top: 2rem !important;
      overflow-y: scroll !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      position: relative !important;
    }
    .caption-container::-webkit-scrollbar {
      display: none !important;
    }
    .caption-box {
      font-size: 2.7vw !important;
      line-height: 1.4 !important;
      font-weight: 600 !important;
      color: #222 !important;
      word-wrap: break-word !important;
      white-space: pre-line !important;
      padding-bottom: 6rem !important;
    }
    video, #image-player {
      background: #000 !important;
      background-color: #000 !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="media-column">
      <img id="image-player" style="display:none; width:100%; height:100%; object-fit:contain; background-color:#050505;" />
      <video id="player" autoplay playsinline muted loop preload="auto" style="width:100%; height:100%; object-fit:contain; background-color:#050505;">
        <source id="video-source" src="" type="video/mp4">
      </video>
    </div>

    <div class="info-column">
      <div class="header-box" id="header-box">
        <div>
          <span class="badge" id="post-badge">SOMZÃO</span>
          <h1 class="brand-title">GRUPO <span>SOMZÃO</span></h1>
        </div>
        <img src="logo.png" alt="Logo Somzão" class="brand-logo" onerror="this.src='logo.pmg'" />
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-text" id="caption-text">Carregando novidades...</div>
      </div>

      <div class="footer-handles">
        <span>📍 @loja_somzao</span>
        <span>✨ @estetica_somzao</span>
      </div>
    </div>
  </div>

      <script>
    function iniciarAutoScroll(container) {
      if (!container) return;
      if (window.__scrollInterval) clearInterval(window.__scrollInterval);
      if (window.__scrollTimer) clearTimeout(window.__scrollTimer);

      container.scrollTop = 0;

      window.__scrollTimer = setTimeout(function() {
        var diferenca = container.scrollHeight - container.clientHeight;
        if (diferenca > 15) {
          var descendo = true;
          var pausado = false;

          window.__scrollInterval = setInterval(function() {
            if (pausado) return;

            if (descendo) {
              container.scrollTop += 1;
              if (container.scrollTop >= diferenca) {
                pausado = true;
                setTimeout(function() {
                  descendo = false;
                  pausado = false;
                }, 3000);
              }
            } else {
              container.scrollTop -= 3;
              if (container.scrollTop <= 0) {
                container.scrollTop = 0;
                descendo = true;
                pausado = true;
                setTimeout(function() {
                  pausado = false;
                }, 3500);
              }
            }
          }, 35);
        }
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', function() {
      var containerElem = document.getElementById('caption-container');
      var captionElem = document.getElementById('caption-text');
      var player = document.getElementById('player');
      var videoSource = document.getElementById('video-source');
      var imagePlayer = document.getElementById('image-player');

      var ts = new Date().getTime();

      fetch('data.json?v=' + ts)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(posts) {
          if (!Array.isArray(posts) || posts.length === 0) {
            if (captionElem) captionElem.textContent = 'Nenhuma publicação encontrada.';
            return;
          }

          var urlParams = new URLSearchParams(window.location.search);
          var postParam = urlParams.get('post');
          var postIdx = parseInt(postParam, 10);

          var currentPost = posts[0];
          if (!isNaN(postIdx)) {
            var encontrado = posts.filter(function(p) {
              return p.id === postIdx || String(p.id) === String(postIdx);
            });
            currentPost = (encontrado.length > 0) ? encontrado[0] : (posts[postIdx - 1] || posts[0]);
          }

          var texto = currentPost.caption || currentPost.text || '';
          texto = texto.replace(/\n{3,}/g, '\n\n').trim();

          if (captionElem) {
            captionElem.textContent = texto;
            iniciarAutoScroll(containerElem);
          }

          var midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
          var isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.indexOf('.jpg') !== -1 || midiaArquivo.indexOf('.png') !== -1));

          if (isFoto) {
            if (player) {
              player.pause();
              player.style.display = 'none';
            }
            if (imagePlayer) {
              imagePlayer.style.display = 'block';
              imagePlayer.src = midiaArquivo + '?v=' + ts;
            }
          } else {
            if (imagePlayer) imagePlayer.style.display = 'none';
            if (player && videoSource) {
              player.style.display = 'block';
              player.style.backgroundColor = '#000';
              player.loop = true;

              player.onended = function() {
                player.currentTime = 0;
                player.play().catch(function() {});
              };

              videoSource.src = midiaArquivo + '?v=' + ts;
              player.load();
              player.play().catch(function(e) { console.log('Autoplay:', e); });
            }
          }
        })
        .catch(function(err) {
          console.error('Erro ao carregar dados:', err);
          if (captionElem) captionElem.textContent = 'Erro ao carregar dados do mural.';
        });
    });
  </script>
</body>
</html>
