<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - Somzão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0c10;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
      color: #fff;
    }

    .container {
      display: flex;
      width: 100vw;
      height: 100vh;
      padding: 3vh 3vw;
      gap: 3vw;
    }

    .media-column {
      flex: 0 0 35%;
      height: 100%;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background-color: #050505;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, #image-player {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #050505;
    }

    .info-column {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: linear-gradient(145deg, #12141a, #1a1e26);
      border-radius: 20px;
      padding: 3.5vh 2.5vw;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #232733;
      position: relative;
    }

    .header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #e11d48;
      padding-bottom: 2vh;
      margin-bottom: 2vh;
      flex-shrink: 0;
    }

        .brand-logo {
      height: 7.5vh;
      max-width: 14vw;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    .brand-title {
      font-size: 2.2vw;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .brand-title span {
      color: #e11d48;
    }

    .badge {
      background: #e11d48;
      color: #fff;
      font-size: 0.85vw;
      font-weight: 800;
      padding: 5px 14px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: inline-block;
      margin-bottom: 6px;
      transition: background 0.3s ease;
    }

    .caption-container {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .caption-text {
      width: 100%;
      color: #e5e5e5;
      font-weight: 500;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .footer-handles {
      display: flex;
      gap: 1.5vw;
      margin-top: 1.5vh;
      font-size: 0.9vw;
      font-weight: 700;
      color: #8f9cae;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="media-column">
      <img id="image-player" style="display:none; width:100%; height:100%; object-fit:contain; background-color:#050505;" />
      <video id="player" autoplay playsinline muted loop preload="auto" style="width:100%; height:100%; object-fit:contain; background-color:#050505;">
        <source id="video-source" src="" type="video/mp4">
      </video>
    </div>

    <div class="info-column">
      <div class="header-box" id="header-box">
        <div>
          <span class="badge" id="post-badge">SOMZÃO</span>
          <h1 class="brand-title">GRUPO <span>SOMZÃO</span></h1>
        </div>
        <img src="logo.png" alt="Logo Somzão" class="brand-logo" onerror="this.src='logo.pmg'" />
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-text" id="caption-text">Carregando novidades...</div>
      </div>

      <div class="footer-handles">
        <span>📍 @loja_somzao</span>
        <span>✨ @estetica_somzao</span>
      </div>
    </div>
  </div>

  <script>
    function ajustarFonteTexto(container, elemento) {
      let fontSize = window.innerHeight * 0.024;
      const minFontSize = window.innerHeight * 0.013;
      elemento.style.fontSize = `${fontSize}px`;
      elemento.style.lineHeight = '1.45';

      while (elemento.scrollHeight > container.clientHeight && fontSize > minFontSize) {
        fontSize -= 0.5;
        elemento.style.fontSize = `${fontSize}px`;
      }

      if (elemento.scrollHeight > container.clientHeight) {
        elemento.style.lineHeight = '1.3';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const timestamp = Date.now();
      const containerElem = document.getElementById('caption-container');
      const captionElem = document.getElementById('caption-text');
      const badgeElem = document.getElementById('post-badge');
      const headerElem = document.getElementById('header-box');
      const player = document.getElementById('player');
      const videoSource = document.getElementById('video-source');
      const imagePlayer = document.getElementById('image-player');

      try {
        const response = await fetch(`data.json?t=${timestamp}`);
        const posts = await response.json();
        if (!Array.isArray(posts) || posts.length === 0) return;

        const urlParams = new URLSearchParams(window.location.search);
        const postParam = urlParams.get('post');
        const postIdx = parseInt(postParam, 10);

        let currentPost = posts[0];
        if (!isNaN(postIdx)) {
          currentPost = posts.find(p => p.id === postIdx || String(p.id) === String(postIdx)) || posts[postIdx - 1] || posts[0];
        }

        // Atualiza a badge e cor de destaque de acordo com o perfil do post
        if (currentPost.badge) {
          badgeElem.textContent = currentPost.badge;
        }
        if (currentPost.badge_color) {
          badgeElem.style.background = currentPost.badge_color;
          headerElem.style.borderBottomColor = currentPost.badge_color;
        }

        let texto = currentPost.caption || currentPost.text || '';
        texto = texto.replace(/\n{3,}/g, '\n\n').trim();
        captionElem.textContent = texto;

        ajustarFonteTexto(containerElem, captionElem);
        window.addEventListener('resize', () => ajustarFonteTexto(containerElem, captionElem));

        const midiaArquivo = currentPost.media || currentPost.media_file || currentPost.video_file;
        const isFoto = currentPost.type === 'image' || (midiaArquivo && (midiaArquivo.endsWith('.jpg') || midiaArquivo.endsWith('.png')));

        if (isFoto) {
          if (player) {
            player.pause();
            player.style.display = 'none';
          }
          if (imagePlayer) {
            imagePlayer.style.display = 'block';
            imagePlayer.src = `${midiaArquivo}?t=${timestamp}`;
          }
        } else {
          if (imagePlayer) imagePlayer.style.display = 'none';
          if (player && videoSource) {
            player.style.display = 'block';
            videoSource.src = `${midiaArquivo}?t=${timestamp}`;
            player.load();
            player.play().catch(e => console.log('Autoplay:', e));
          }
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
